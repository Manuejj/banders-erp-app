<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection</title>
<style>
body{font-family:Roboto,Arial,sans-serif;background:#FFF8E7;color:#1D2433;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.c{background:#fff;border:1px solid #DDE2EC;border-radius:16px;padding:28px 24px;max-width:380px;text-align:center}
h1{font-size:22px;margin:0 0 8px} p{color:#6B7488;margin:0 0 20px;line-height:1.5}
button{background:#1F5FD6;color:#fff;border:0;border-radius:10px;padding:14px 28px;font-size:17px}
</style></head>
<body><div class="c"><h1>No connection</h1>
<p>Banders Potato ERP could not reach the server. Check the internet (Wi-Fi or mobile data) and try again.</p>
<button onclick="retry()">Try again</button></div>
<script>function retry(){var u=new URLSearchParams(location.search).get('url'); if(u) location.href=u;}</script>
</body></html>
